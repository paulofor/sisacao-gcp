steps:
  # Build Docker image
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    args:
      - bash
      - -c
      - |
        gcloud builds submit --tag "us-central1-docker.pkg.dev/$PROJECT_ID/stock/collector:latest" .

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    args:
      - run
      - deploy
      - stock-collector
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/stock/collector:latest
      - --region=us-central1
      - --gen2
      - --memory=256Mi
      - --min-instances=0
      - --service-account=collector-sa@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=DATASET_ID=cotacao_intraday,TABLE_ID=cotacao_bovespa
      - --set-secrets=ALPHAVANTAGE_KEY=projects/$PROJECT_ID/secrets/ALPHA/versions/1

timeout: "900s"
options:
  machineType: "E2_STANDARD_2"
